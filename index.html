<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loading-screen" class="hidden">
        <div class="spinner-container">
            <video autoplay loop muted class="loading-animation">
                <source src="https://discord.com/assets/f0986c98a47454f7.mp4" type="video/mp4">
            </video>
            <p>DIALING DISCORD...</p>
        </div>
    </div>

    <div id="login-container" class="login-wrapper fade-in">
        <div class="login-box">
            <img src="https://raw.githubusercontent.com/pignataro/discord-logo-svg/master/discord-logo-blue.svg" width="80" class="logo-bounce">
            <div id="login-content">
                <h2>Welcome back!</h2>
                <p class="subtitle">Log in with your token to sync with Discord.</p>
                <div class="input-group">
                    <label>TOKEN</label>
                    <input type="password" id="tokenInput" placeholder="Paste your token here">
                </div>
                <button onclick="startCountdown()">Log In</button>
            </div>
            
            <div id="countdown-area" class="hidden">
                <h1 id="timer" class="pulse">3</h1>
                <p>Establishing Bridge...</p>
            </div>
        </div>
    </div>

    <div id="main-client" class="hidden">
        <div class="sidebar-servers slide-in-left">
            <div class="nav-item home-btn active">
                <img src="https://raw.githubusercontent.com/pignataro/discord-logo-svg/master/discord-logo-white.svg" width="28">
            </div>
            <div class="nav-separator"></div>
            <div id="server-icons-list"></div>
        </div>

        <div class="sidebar-dms slide-in-left-delayed">
            <div class="dm-header">DIRECT MESSAGES</div>
            <div class="user-panel" id="user-profile"></div>
        </div>

        <div class="main-content slide-in-bottom">
            <div class="top-nav">
                <div class="nav-title">Friends</div>
            </div>
            <div class="friends-list">
                <div class="empty-state">
                    <img src="https://discord.com/assets/679a9575f0a8c201d41d.svg" width="300">
                    <p>Wumpus is waiting for friends...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
