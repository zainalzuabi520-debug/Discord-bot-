<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Admin - Direct Connect</title>
    <style>
        :root { --bg: #313338; --dark: #1e1f22; --blurple: #5865f2; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }
        
        /* Professional Login UI */
        #login-screen { position: fixed; inset: 0; background: var(--blurple); z-index: 100; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--bg); padding: 40px; border-radius: 8px; width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; background: var(--dark); border: none; border-radius: 4px; color: white; margin: 15px 0; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: var(--blurple); border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }
        
        /* Main UI */
        .sidebar { width: 240px; background: #2b2d31; display: flex; flex-direction: column; }
        .content { flex: 1; display: flex; flex-direction: column; }
        #chat { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg); }
        .input-area { padding: 20px; }
        .msg-input { width: 100%; padding: 14px; background: #383a40; border-radius: 8px; border: none; color: white; outline: none; }
        .user-tag { background: #232428; padding: 10px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .badge { background: #ed4245; font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Bridge Login</h2>
            <p style="color:#b5bac1; font-size:14px;">Direct WebSocket Connection (No Proxy Required)</p>
            <input type="password" id="botToken" placeholder="Paste Bot Token">
            <button onclick="connectDirect()">Connect</button>
            <p id="log" style="font-size: 11px; margin-top: 15px; color: #f2d458;"></p>
        </div>
    </div>

    <div class="sidebar">
        <div style="padding:15px; font-weight:bold; border-bottom:1px solid #1f2023;">Admin Panel</div>
        <div style="flex:1; padding:10px;">
            <div style="padding:10px; cursor:pointer;" onclick="createCmd()">➕ Create Command</div>
        </div>
        <div class="user-tag" id="profile"></div>
    </div>

    <div class="content">
        <div id="chat"></div>
        <div class="input-area">
            <input type="text" id="msgInp" class="msg-input" placeholder="Message Discord..." onkeydown="handleChat(event)">
        </div>
    </div>
