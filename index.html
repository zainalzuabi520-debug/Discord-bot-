<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-container" class="box">
        <img src="https://assets-global.website-files.com/6257adef93867a3f588a4c92/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" width="70">
        
        <div id="login-form">
            <h2>Welcome back!</h2>
            <p class="subtitle">Log in with your bot token</p>
            <div class="input-group">
                <label>TOKEN</label>
                <input type="password" id="tokenInput">
            </div>
            <button onclick="startCountdown()">Log In</button>
        </div>

        <div id="countdown-area" class="hidden">
            <h1 id="timer">3</h1>
            <p>Connecting to Discord Gateway...</p>
        </div>
    </div>

    <div id="main-client" class="hidden">
        <div id="user-profile"></div>
        <div class="chat-placeholder">
            <p>Connected to Discord API via GitHub Pages</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
