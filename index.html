<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Admin Pro</title>
    <style>
        :root { --bg: #313338; --side: #2b2d31; --dark: #1e1f22; --blurple: #5865f2; --text: #dbdee1; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* Layout */
        .srv-col { width: 72px; background: var(--dark); display: flex; flex-direction: column; align-items: center; padding-top: 12px; }
        .dm-col { width: 240px; background: var(--side); display: flex; flex-direction: column; }
        .chat-col { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
        
        /* UI Elements */
        .icon { width: 48px; height: 48px; border-radius: 50%; background: #313338; margin-bottom: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .icon:hover { border-radius: 15px; background: var(--blurple); }
        .item { padding: 10px; margin: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .item:hover { background: #35373c; }

        /* Login Screen */
        #login-screen { position: fixed; inset: 0; background: var(--blurple); z-index: 100; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--bg); padding: 40px; border-radius: 8px; width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        input { width: 100%; padding: 12px; background: var(--dark); border: none; border-radius: 4px; color: white; margin: 15px 0; outline: none; box-sizing: border-box;}
        button { width: 100%; padding: 12px; background: var(--blurple); border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }

        /* Chat System */
        #chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { background: #383a40; padding: 10px; border-radius: 8px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .input-area { padding: 20px; background: var(--bg); }
        .main-input { width: 100%; padding: 14px; background: #383a40; border-radius: 8px; border: none; color: white; outline: none; }
        
        .footer { background: #232428; padding: 10px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .badge { background: #ed4245; font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-top:0">Bridge Connection</h2>
            <p style="color: #b5bac1; font-size: 14px;">Enter your Bot Token to sync with Discord.</p>
            <input type="password" id="tokenField" placeholder="Bot Token">
            <button onclick="startBridge()">Connect Now</button>
            <p id="debug-log" style="font-size: 11px; margin-top: 15px; color: #f2d458;"></p>
        </div>
    </div>

    <div class="srv-col">
        <div class="icon" style="background: var(--blurple); border-radius: 15px;">D</div>
    </div>

    <div class="dm-col">
        <div style="padding: 15px; font-weight: bold; border-bottom: 1px solid #1f2023;">Direct Messages</div>
        <div style="flex: 1; padding-top: 10px;">
            <div class="item" onclick="createNewCommand()">➕ Create Command</div>
        </div>
        <div class="footer" id="user-info"></div>
    </div>

    <div class="chat-col">
        <div id="chat"></div>
        <div class="input-area">
            <input type="text" class="main-input" id="messageInp" placeholder="Type a message or command..." onkeydown="handleKey(event)">
        </div>
    </div>

    <script>
        let TOKEN = "";
        let botID = "";

        function log(msg) { document.getElementById('debug-log').innerText = msg; }

        async function startBridge() {
            TOKEN = document.getElementById('tokenField').value;
            if(!TOKEN) return alert("Enter a token!");
            
            log("Opening WebSocket...");
            const ws = new WebSocket('wss://gateway.discord.gg/?v=10&encoding=json');
